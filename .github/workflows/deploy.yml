name: Test & Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # Run the suite on BOTH sqlite (fast) and Postgres (prod parity — catches
    # Postgres-only migration/constraint bugs SQLite silently tolerates). Both
    # legs must pass for deploy; fail-fast off so a Postgres-only failure still
    # lets the sqlite leg report.
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tm_test
          POSTGRES_USER: tm
          POSTGRES_PASSWORD: tm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests (${{ matrix.db }})
        # The settings are fail-loud (no defaults for SECRET_KEY / DEBUG /
        # ALLOWED_HOSTS / FRONTEND_BASE_URL / GRAPH_*). pytest uses the dev settings
        # (pytest.ini). DB_ENGINE empty → sqlite; 'postgresql' → the service via the
        # unified DB_* convention. These are throwaway CI values.
        env:
          DEBUG: "True"
          SECRET_KEY: ci-secret-key-not-used-in-prod
          ALLOWED_HOSTS: "*"
          STATE: TEST
          WEBSITE: localhost
          FRONTEND_BASE_URL: http://localhost:4200
          GRAPH_TENANT_ID: ci
          GRAPH_CLIENT_ID: ci
          GRAPH_CLIENT_SECRET: ci
          GRAPH_SENDER: ci@example.com
          DB_ENGINE: ${{ matrix.db == 'postgres' && 'postgresql' || '' }}
          DB_NAME: tm_test
          DB_USER: tm
          DB_PASSWORD: tm
          DB_HOST: localhost
          DB_PORT: "5432"
        run: pytest -q

      - name: OpenAPI schema drift guard
        # The committed openapi-schema.yaml is the frontend's client contract.
        # Fail if the code's generated schema drifts from it (must be regenerated
        # in the same commit). Runs once (sqlite leg) — no DB needed.
        if: matrix.db == 'sqlite'
        env:
          DEBUG: "True"
          SECRET_KEY: ci-secret-key-not-used-in-prod
          ALLOWED_HOSTS: "*"
          STATE: TEST
          WEBSITE: localhost
          FRONTEND_BASE_URL: http://localhost:4200
          GRAPH_TENANT_ID: ci
          GRAPH_CLIENT_ID: ci
          GRAPH_CLIENT_SECRET: ci
          GRAPH_SENDER: ci@example.com
        run: |
          python manage.py spectacular --file /tmp/schema.yaml
          if ! diff <(tr -d '\r' < openapi-schema.yaml) <(tr -d '\r' < /tmp/schema.yaml) > /tmp/schema.diff; then
            echo "::error::openapi-schema.yaml is out of sync. Run 'python manage.py spectacular --file openapi-schema.yaml' and commit it."
            head -60 /tmp/schema.diff
            exit 1
          fi
          echo "OpenAPI schema in sync."

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      id-token: write    # mint the OIDC token to assume the deploy role
      contents: read

    steps:
      # Deploy is OIDC -> SSM (no long-lived SSH key). AWS-RunShellScript runs as
      # root and invokes deploy.sh as django (git reset, pip, migrate,
      # collectstatic, perms, restart via the tm-deploy sudoers grant). Secrets
      # stay in SSM (/tm/prod/*), fetched to /run/tm/.env at boot by tm-env-fetch.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
          role-session-name: gh-actions-${{ github.run_id }}

      - name: Trigger deploy on EC2 via SSM
        id: ssm
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          cat > /tmp/ssm-params.json <<'EOF'
          { "commands": [
            "sudo -u django bash -c 'umask 027; cd /var/www/django_websites/trainingmanager_server && git fetch --quiet origin main && git reset --hard --quiet origin/main'",
            "sudo -u django bash /var/www/django_websites/trainingmanager_server/deploy/deploy.sh"
          ], "executionTimeout": ["900"] }
          EOF
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy tm ${{ github.sha }}" \
            --cloud-watch-output-config CloudWatchOutputEnabled=true \
            --parameters file:///tmp/ssm-params.json \
            --query Command.CommandId --output text)
          echo "Command ID: $CMD_ID"
          echo "cmd_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM command to finish
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          CMD_ID: ${{ steps.ssm.outputs.cmd_id }}
        run: |
          for _ in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success)
                echo "::group::stdout"
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
                echo "::endgroup::"
                exit 0 ;;
              Failed|Cancelled|TimedOut)
                echo "Deploy $STATUS"
                echo "::group::stdout"
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
                echo "::endgroup::"
                echo "::group::stderr"
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
                echo "::endgroup::"
                exit 1 ;;
              *) sleep 5 ;;
            esac
          done
          echo "Timed out waiting for SSM command after 15 minutes"
          exit 1
