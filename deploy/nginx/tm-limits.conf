# Rate-limit zones — `http` context.
#
# Installed (root, out-of-band) as /etc/nginx/conf.d/tm-limits.conf. A
# `limit_req_zone` cannot be declared inside a `server` block, hence this
# separate file; the `limit_req` that use it live in deploy/nginx/tm-api.conf.
# Install this file BEFORE the vhost: nginx refuses an unknown zone (`nginx -t`).
#
# `tm_admin_login` guards /admin/login/, a plain Django view that the DRF
# throttles do not cover. 10r/m per IP: far above human use, far below what a
# password-guessing run needs. Same model as PushIT (pushit-limits.conf).
limit_req_zone $binary_remote_addr zone=tm_admin_login:10m rate=10r/m;
