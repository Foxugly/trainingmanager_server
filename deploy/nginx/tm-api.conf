# Training Manager API — nginx reverse proxy to Gunicorn (127.0.0.1:8005).
#
# TLS uses the existing *.foxugly.com WILDCARD cert (DNS-01) — NO per-domain
# certbot. tm-api.foxugly.com is already covered by
# /etc/letsencrypt/live/foxugly.com/ (SAN *.foxugly.com). Mirrors the netdata
# vhost. The box-wide 00-default-deny vhost drops unknown-Host scans (§3.6).
#
# Installed to /etc/nginx/sites-available/tm-api.conf and symlinked into
# sites-enabled by deploy/setup-server.sh.

server {
    listen 80;
    server_name tm-api.foxugly.com;
    # All HTTP → HTTPS (the wildcard cert serves 443).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tm-api.foxugly.com;

    ssl_certificate     /etc/letsencrypt/live/foxugly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foxugly.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    # --- Compression (dynamic) ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml
        application/rss+xml application/manifest+json
        image/svg+xml application/x-font-ttf font/otf application/vnd.ms-fontobject
        application/vnd.oai.openapi+json application/vnd.oai.openapi application/yaml text/yaml;

    brotli on;
    brotli_comp_level 5;
    brotli_types
        text/plain text/css text/xml
        application/json application/javascript application/xml
        application/rss+xml application/manifest+json
        image/svg+xml application/x-font-ttf font/otf application/vnd.ms-fontobject
        application/vnd.oai.openapi+json application/vnd.oai.openapi application/yaml text/yaml;

    location /static/ {
        alias /var/www/django_websites/trainingmanager_server/staticfiles/;
        access_log off;
        expires 30d;
    }

    location / {
        # Upstream is the Gunicorn TCP bind from deploy/gunicorn.conf.py.
        # Keep this in sync with `bind` there — socket/port mismatch => 502.
        proxy_pass http://127.0.0.1:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    access_log /var/log/nginx/tm-access.log;
    error_log  /var/log/nginx/tm-error.log;
}
