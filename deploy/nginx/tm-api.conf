# Training Manager API — nginx reverse proxy to Gunicorn (127.0.0.1:8005).
# Certbot (`certbot --nginx -d tm-api.foxugly.com`) adds the 443 server block
# and the HTTP->HTTPS redirect on top of this.
#
# Installed to /etc/nginx/sites-available/tm-api.conf and symlinked into
# sites-enabled by deploy/setup-server.sh. The box-wide 00-default-deny vhost
# already drops unknown-Host scans (OPERATIONS.md §3.6).

server {
    listen 80;
    server_name tm-api.foxugly.com;

    client_max_body_size 25m;

    # --- Compression (dynamic) ---
    # API serves mostly JSON + Django static (admin/DRF/OpenAPI). Compress
    # text-like types only; never images / woff2 (already compressed).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml
        application/rss+xml application/manifest+json
        image/svg+xml application/x-font-ttf font/otf application/vnd.ms-fontobject
        application/vnd.oai.openapi+json application/vnd.oai.openapi application/yaml text/yaml;

    brotli on;
    brotli_comp_level 5;
    brotli_types
        text/plain text/css text/xml
        application/json application/javascript application/xml
        application/rss+xml application/manifest+json
        image/svg+xml application/x-font-ttf font/otf application/vnd.ms-fontobject
        application/vnd.oai.openapi+json application/vnd.oai.openapi application/yaml text/yaml;

    location /static/ {
        alias /var/www/django_websites/trainingmanager_server/staticfiles/;
        access_log off;
        expires 30d;
    }

    location / {
        # Upstream is the Gunicorn TCP bind from deploy/gunicorn.conf.py.
        # Keep this in sync with `bind` there — socket/port mismatch => 502.
        proxy_pass http://127.0.0.1:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    access_log /var/log/nginx/tm-access.log;
    error_log  /var/log/nginx/tm-error.log;
}
