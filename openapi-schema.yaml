components:
  schemas:
    AIPingRequest:
      type: object
      properties:
        prompt:
          type: string
          description: Prompt to send to Claude. Defaults to a hello-world prompt.
    AIPingResponse:
      type: object
      properties:
        text:
          type: string
        model:
          type: string
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        stop_reason:
          type: string
      required:
      - input_tokens
      - model
      - output_tokens
      - stop_reason
      - text
    AIUsageAggregateResponse:
      type: object
      description: Top-level aggregate response.
      properties:
        team_id:
          type: integer
        period:
          type: string
        exclude_ping:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/AIUsageAggregateRow'
      required:
      - data
      - exclude_ping
      - period
      - team_id
    AIUsageAggregateRow:
      type: object
      description: One row of the aggregated usage response (per period bucket).
      properties:
        period:
          type: string
        total_calls:
          type: integer
        total_tokens:
          type: integer
        input_tokens:
          type: integer
        output_tokens:
          type: integer
      required:
      - input_tokens
      - output_tokens
      - period
      - total_calls
      - total_tokens
    AIUsageDetail:
      type: object
      description: Single AI call row, with username for display.
      properties:
        id:
          type: integer
          readOnly: true
        endpoint:
          allOf:
          - $ref: '#/components/schemas/EndpointEnum'
          readOnly: true
        model_used:
          type: string
          readOnly: true
          description: Anthropic model identifier (e.g. claude-haiku-4-5)
        input_tokens:
          type: integer
          readOnly: true
        output_tokens:
          type: integer
          readOnly: true
        cache_creation_tokens:
          type: integer
          readOnly: true
        cache_read_tokens:
          type: integer
          readOnly: true
        total_tokens:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - cache_creation_tokens
      - cache_read_tokens
      - created_at
      - endpoint
      - id
      - input_tokens
      - model_used
      - output_tokens
      - total_tokens
      - username
    AccountDelete:
      type: object
      description: |-
        Body of POST /api/v1/auth/account/delete/ (authenticated).

        The caller proves they still know `current_password` before their
        account is irreversibly deleted. The view performs the `check_password`
        comparison and the owned-teams safety guard — the serializer only
        enforces that the confirmation password is present.
      properties:
        current_password:
          type: string
          writeOnly: true
      required:
      - current_password
    ActionProposedEnum:
      enum:
      - accept
      - reject
      type: string
      description: |-
        * `accept` - accept
        * `reject` - reject
    Attendance:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event:
          type: integer
          readOnly: true
        member:
          type: integer
        member_fullname:
          type: string
          readOnly: true
        status:
          type: integer
        status_code:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - event
      - id
      - member
      - member_fullname
      - status
      - status_code
      - updated_at
    AttendanceBulk:
