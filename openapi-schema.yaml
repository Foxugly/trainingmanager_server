        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - energy_systems
      - id
      - is_active
      - name
      - slug
    SportAdmin:
      type: object
      description: |-
        Admin flavor: exposes per-language name variants and write-capable
        M2M energy_systems (PK list).
      properties:
        id:
          type: integer
          readOnly: true
        name_fr:
          type: string
          nullable: true
          title: Name [fr]
          maxLength: 100
        name_nl:
          type: string
          nullable: true
          title: Name [nl]
          maxLength: 100
        name_en:
          type: string
          nullable: true
          title: Name [en]
          maxLength: 100
        name_it:
          type: string
          nullable: true
          title: Name [it]
          maxLength: 100
        name_es:
          type: string
          nullable: true
          title: Name [es]
          maxLength: 100
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        is_active:
          type: boolean
        energy_systems:
          type: array
          items:
            type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - slug
    StatsAttendance:
      type: object
      properties:
        team_rate:
          type: number
          format: double
          nullable: true
          description: Overall present / expected across the period (null if no expected
            slots).
        by_session:
          type: array
          items:
            $ref: '#/components/schemas/StatsAttendanceBySession'
        by_member:
          type: array
          items:
            $ref: '#/components/schemas/StatsAttendanceByMember'
      required:
      - by_member
      - by_session
      - team_rate
    StatsAttendanceByMember:
      type: object
      properties:
        member_id:
          type: integer
        name:
          type: string
        present:
          type: integer
        total:
          type: integer
        rate:
          type: number
          format: double
          nullable: true
        last_present_date:
          type: string
          format: date
          nullable: true
      required:
      - last_present_date
      - member_id
      - name
      - present
      - rate
      - total
    StatsAttendanceBySession:
      type: object
      properties:
        event_id:
          type: integer
        name:
          type: string
        date:
          type: string
          format: date
          nullable: true
        present:
          type: integer
        total:
          type: integer
        rate:
          type: number
          format: double
          nullable: true
      required:
      - date
      - event_id
      - name
      - present
      - rate
      - total
    StatsIntensity:
      type: object
      properties:
        by_segment:
          type: array
          items:
            $ref: '#/components/schemas/StatsIntensityBySegment'
      required:
      - by_segment
    StatsIntensityBySegment:
      type: object
      properties:
        abv:
          type: string
        label:
          type: string
          nullable: true
          description: Localized segment description.
        distance:
          type: integer
      required:
      - abv
      - distance
      - label
    StatsMember:
      type: object
      description: |-
        The athlete a per-member scoped payload is restricted to. Null on the
        team-aggregate response (no ?member= query param).
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    StatsPeriod:
      type: object
      properties:
        to:
          type: string
          format: date
          description: Window end (inclusive).
        from:
          type: string
          format: date
          description: Window start (inclusive).
      required:
      - from
      - to
    StatsVolume:
      type: object
      properties:
        total_distance:
          type: integer
        by_week:
          type: array
          items:
            $ref: '#/components/schemas/StatsVolumeByWeek'
        by_member:
          type: array
          items:
            $ref: '#/components/schemas/StatsVolumeByMember'
      required:
      - by_member
      - by_week
      - total_distance
    StatsVolumeByMember:
      type: object
      properties:
        member_id:
          type: integer
        name:
          type: string
        distance:
          type: integer
      required:
      - distance
      - member_id
      - name
    StatsVolumeByWeek:
      type: object
      properties:
        week_start:
          type: string
          format: date
          description: Monday (ISO) of the bucketed week.
        distance:
          type: integer
      required:
      - distance
      - week_start
    Team:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        sport:
          allOf:
          - $ref: '#/components/schemas/Sport'
          readOnly: true
        sport_id:
          type: integer
          writeOnly: true
        level:
          allOf:
          - $ref: '#/components/schemas/Level'
          readOnly: true
        level_id:
          type: integer
          writeOnly: true
          nullable: true
        owner:
          allOf:
          - $ref: '#/components/schemas/CustomUserPublic'
          readOnly: true
        managers:
          type: array
          items:
            $ref: '#/components/schemas/CustomUserPublic'
          readOnly: true
        managers_ids:
          type: array
          items:
            type: integer
            writeOnly: true
          writeOnly: true
        language:
          $ref: '#/components/schemas/LanguageEnum'
        is_active:
          type: boolean
        is_public:
          type: boolean
        logo:
          type: string
          description: Small base64 data-URL for the team logo (e.g. 'data:image/png;base64,...').
            Stored inline in the DB; no file storage.
        roti_enabled:
          type: boolean
          description: If True, athletes can submit a per-session difficulty rating
            (ROTI, 1..5) for the team's events.
        chat_mode:
          allOf:
          - $ref: '#/components/schemas/ChatModeEnum'
          description: |-
            Defines who can post messages in the team chat.

            * `all` - All members can post
            * `coaches_only` - Only coaches can post
        athlete_can_read_notes:
          type: boolean
          description: If True, athletes can read their own coach notes. Default False
            (notes are coach-only).
        attendance_statuses:
          type: array
          items:
            type: integer
          description: 'Statuses available for marking attendance in this team''s
            events. Default: present, absent, excused.'
        join_request_policy:
          allOf:
          - $ref: '#/components/schemas/JoinRequestPolicyEnum'
          description: |-
            Manual = managers accept/reject each TeamJoinRequest. Auto = every join request is accepted immediately on submission.

            * `manual` - Manual — managers accept/reject each request
            * `auto` - Auto-accept — every join request is accepted immediately
        notify_managers_on_join_request:
          type: boolean
          description: When join_request_policy=manual, send the owner and managers
            an email with accept/reject magic links on each new request. Ignored when
            policy=auto (no manual decision is needed).
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - level
      - managers
      - name
      - owner
      - sport
      - sport_id
      - updated_at
    TeamInvitation:
      type: object
      description: List/detail view for managers. Token is intentionally excluded.
      properties:
        id:
          type: integer
          readOnly: true
        team:
          type: integer
        invited_by:
          type: integer
          readOnly: true
          nullable: true
        member:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        status:
          allOf:
          - $ref: '#/components/schemas/InvitationStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - completed_at
      - created_at
      - email
      - expires_at
      - id
      - invited_by
      - member
      - status
      - team
    TeamJoinRequest:
      type: object
      description: |-
        Standard serializer for /join-requests/. Mirrors TeamMembershipSerializer's
        pattern of exposing username/fullname denorms so the manager dashboard can
        render the requester without a separate /users/{id}/ fetch.
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        user_username:
          type: string
          readOnly: true
        user_fullname:
          type: string
          readOnly: true
        team:
          type: integer
        status:
          $ref: '#/components/schemas/JoinRequestStatusEnum'
        message:
          type: string
        response_message:
          type: string
        requested_at:
          type: string
          format: date-time
          readOnly: true
        responded_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        responded_by:
          type: integer
          readOnly: true
          nullable: true
        responded_by_username:
          type: string
          readOnly: true
          nullable: true
      required:
      - id
      - requested_at
      - responded_at
      - responded_by
      - responded_by_username
      - team
      - user
      - user_fullname
      - user_username
    TeamJoinRequestMagicActionPost:
      type: object
      description: |-
        Body of POST /api/v1/join-magic/. Token is the HMAC-signed link
        received in the manager email.
      properties:
        token:
          type: string
      required:
      - token
    TeamJoinRequestMagicActionResponse:
      type: object
      description: |-
        200 response for both GET (preview) and POST (execute) on
        /api/v1/join-magic/. Identical shape — POST just reflects the
        post-action state in `join_request.status`.
      properties:
        join_request:
          $ref: '#/components/schemas/_MagicActionJoinRequest'
        action_proposed:
          $ref: '#/components/schemas/ActionProposedEnum'
        would_change_decision:
          type: boolean
          description: True iff the action — if executed — would reverse a previous
            manager decision (accepted->rejected or rejected->accepted).
        can_act:
          type: boolean
          description: False when the request was cancelled by the requester.
      required:
      - action_proposed
      - can_act
      - join_request
      - would_change_decision
    TeamMembership:
      type: object
      description: |-
        Read/write serializer for TeamMembership.

        `team` is set by the view from URL kwargs; only `member` is accepted on POST.
      properties:
        id:
          type: integer
          readOnly: true
        team:
          type: integer
          readOnly: true
        member:
          type: integer
        member_username:
          type: string
          readOnly: true
        member_fullname:
          type: string
          readOnly: true
        joined_at:
          type: string
          format: date-time
          readOnly: true
          description: When this athlete joined the team.
        left_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When this athlete left the team. NULL = currently active.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - joined_at
      - left_at
      - member
      - member_fullname
      - member_username
      - team
      - updated_at
    TeamMinimal:
      type: object
      description: Compact team payload for nested read contexts.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          readOnly: true
      required:
      - id
      - language
      - name
    TeamQuotaStatus:
      type: object
      description: |-
        Computed quota block embedded in /me/. Tells the frontend whether the
        user can create a new team and how many slots they have used / are
        entitled to.
      properties:
        used:
          type: integer
          description: Active teams currently owned by the user.
        max:
          type: integer
          description: Maximum active teams the user can own (CustomUser.team_quota).
        can_create:
          type: boolean
          description: True iff used < max.
      required:
      - can_create
      - max
      - used
    TeamStats:
      type: object
      description: |-
        Top-level read-only team statistics payload.

        Aggregates attendance, training volume and intensity for the team's
        events whose date falls within the requested window. Output-only:
        the view assembles a plain dict and passes it through this serializer
        for a clean, typed OpenAPI schema.

        `member` is null for the team aggregate, or `{id, name}` when the
        payload is scoped to a single athlete (via ?member=<id>).
      properties:
        period:
          $ref: '#/components/schemas/StatsPeriod'
        member:
          allOf:
          - $ref: '#/components/schemas/StatsMember'
          nullable: true
          description: The athlete the payload is scoped to, or null for the team
            aggregate.
        attendance:
          $ref: '#/components/schemas/StatsAttendance'
        volume:
          $ref: '#/components/schemas/StatsVolume'
        intensity:
          $ref: '#/components/schemas/StatsIntensity'
      required:
      - attendance
      - intensity
      - member
      - period
      - volume
    TokenObtainPairResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    ValidateInvitation:
      type: object
      properties:
        email:
          type: string
          format: email
          readOnly: true
        team_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/InvitationStatusEnum'
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - email
      - expires_at
      - status
      - team_name
    VerifiedTokenObtainPair:
      type: object
      description: |-
        Block JWT login when the user has an unverified primary email.

        Legacy users predating allauth integration have no EmailAddress row;
        they are treated as verified to preserve backwards compatibility (no
        data migration). Once an EmailAddress exists for a user, the
        `verified` flag becomes authoritative.

        Optional `remember` flag (default False) extends the refresh token
        lifetime to settings.SIMPLE_JWT["REFRESH_TOKEN_LIFETIME_REMEMBER"]
        (30 days) instead of the standard REFRESH_TOKEN_LIFETIME (7 days).
        The access token TTL is unchanged either way.
      properties:
        remember:
          type: boolean
          writeOnly: true
          default: false
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    _MagicActionJoinRequest:
      type: object
      description: |-
        Inline shape of the `join_request` field returned by the magic-action
        endpoints. Mirrors the dict assembled in
        TeamJoinRequestMagicActionView._serialize — keep in sync.
      properties:
        id:
          type: integer
        team_id:
          type: integer
        team_name:
          type: string
        requester_username:
          type: string
        requester_email:
          type: string
          format: email
        message:
          type: string
        requested_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/_MagicActionJoinRequestStatusEnum'
        responded_at:
          type: string
          format: date-time
          nullable: true
        responded_by:
          type: string
          nullable: true
          description: username
      required:
      - id
      - message
      - requested_at
      - requester_email
      - requester_username
      - responded_at
      - responded_by
      - status
      - team_id
      - team_name
    _MagicActionJoinRequestStatusEnum:
      enum:
      - pending
      - accepted
      - rejected
      - cancelled
      type: string
      description: |-
        * `pending` - pending
        * `accepted` - accepted
        * `rejected` - rejected
        * `cancelled` - cancelled
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
