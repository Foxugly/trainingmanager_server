        - POST: add a member to the team (manager-only). Idempotent: rejects with
          400 already_member if an active membership already exists for the same
          (team, member) pair.
        - DELETE /{id}/: end a membership (sets left_at = now). Allowed for the
          member herself or a team manager. The team owner cannot leave their own
          team via this endpoint.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this team membership.
        required: true
      - in: query
        name: include_inactive
        schema:
          type: boolean
        description: If true and the user is staff, include soft-deleted (is_active=False)
          records in the result. Silently ignored for non-staff users.
      - in: path
        name: team_pk
        schema:
          type: integer
        required: true
      tags:
      - teams
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/teams/{team_pk}/messages/:
    get:
      operationId: teams_messages_list
      description: |-
        Three modes:
        - Initial load: ?limit=50 returns the 50 most recent messages (default order: newest first).
        - Polling: ?since=<ISO timestamp> returns messages created strictly after the given timestamp (chronological order).
        - Historical scroll: ?before=<ISO timestamp>&limit=50 returns 50 messages older than the given timestamp.

        Soft-deleted messages are returned with deleted_at set so the frontend can render a 'message deleted' placeholder.
      summary: List team chat messages with cursor-based pagination
      parameters:
      - in: query
        name: before
        schema:
          type: string
          format: date-time
        description: 'Returns messages created strictly BEFORE this timestamp. Used
          for historical scroll: pass the timestamp of the oldest message you have.'
      - in: query
        name: limit
        schema:
          type: integer
        description: Maximum number of messages to return. Default 50, max 200.
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: since
        schema:
          type: string
          format: date-time
        description: 'Returns messages created strictly AFTER this timestamp. Used
          for polling: pass the timestamp of the most recent message you have.'
      - in: path
        name: team_pk
        schema:
          type: integer
        required: true
      tags:
      - teams
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
          description: ''
    post:
      operationId: teams_messages_create
      description: |-
        CRUD on team chat messages with cursor-based pagination.

        URL: /api/v1/teams/{team_pk}/messages/
      parameters:
      - in: path
        name: team_pk
        schema:
          type: integer
        required: true
      tags:
      - teams
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Message'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Message'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/v1/teams/{team_pk}/messages/{id}/:
    get:
      operationId: teams_messages_retrieve
      description: |-
