        * `cancelled` - Cancelled
    JoinMagicCancelledResponse:
      type: object
      description: |-
        409 body when the requester cancelled the request. Combines the error
        envelope (code + detail) with the regular response payload so the
        frontend can show "the user cancelled" + the snapshot of what was
        being attempted.
      properties:
        join_request:
          $ref: '#/components/schemas/_MagicActionJoinRequest'
        action_proposed:
          $ref: '#/components/schemas/ActionProposedEnum'
        would_change_decision:
          type: boolean
          description: True iff the action — if executed — would reverse a previous
            manager decision (accepted->rejected or rejected->accepted).
        can_act:
          type: boolean
          description: False when the request was cancelled by the requester.
        code:
          $ref: '#/components/schemas/JoinMagicCancelledResponseCodeEnum'
        detail:
          type: string
      required:
      - action_proposed
      - can_act
      - code
      - detail
      - join_request
      - would_change_decision
    JoinMagicCancelledResponseCodeEnum:
      enum:
      - request_cancelled
      type: string
      description: '* `request_cancelled` - request_cancelled'
    JoinMagicError:
