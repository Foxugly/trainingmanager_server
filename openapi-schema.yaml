          type: integer
        status_code:
          type: string
          maxLength: 30
      required:
      - member_id
      - status_code
    AttendanceStatus:
      type: object
      description: 'Public flavor: ''label'' is auto-localized by modeltranslation.'
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          readOnly: true
          description: Snake_case identifier (e.g. 'present', 'absent', 'excused')
        label:
          type: string
          readOnly: true
          description: Display label, translated via modeltranslation.
        is_default:
          type: boolean
          readOnly: true
          description: If True, pre-selected as default in the frontend UI.
        order:
          type: integer
          readOnly: true
          description: Display order for buttons in the frontend.
        color:
          type: string
          readOnly: true
          description: Hex color (#xxxxxx) for the frontend, optional.
        is_active:
          type: boolean
          readOnly: true
      required:
      - code
      - color
      - id
      - is_active
      - is_default
      - label
      - order
    AttendanceStatusAdmin:
      type: object
      description: 'Admin flavor: exposes per-language label variants.'
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          description: Snake_case identifier (e.g. 'present', 'absent', 'excused')
          maxLength: 30
        label_fr:
          type: string
          nullable: true
          title: Label [fr]
          description: Display label, translated via modeltranslation.
          maxLength: 100
        label_nl:
          type: string
          nullable: true
          title: Label [nl]
          description: Display label, translated via modeltranslation.
          maxLength: 100
        label_en:
          type: string
          nullable: true
          title: Label [en]
          description: Display label, translated via modeltranslation.
          maxLength: 100
        label_it:
          type: string
          nullable: true
          title: Label [it]
          description: Display label, translated via modeltranslation.
          maxLength: 100
        label_es:
          type: string
          nullable: true
          title: Label [es]
          description: Display label, translated via modeltranslation.
          maxLength: 100
        is_default:
          type: boolean
          description: If True, pre-selected as default in the frontend UI.
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
